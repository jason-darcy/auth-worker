name = "auth"
main = "build/index.js"
compatibility_date = "2026-11-18"

[build]
command = "cargo install -q \"worker-build@^0.9\" && worker-build --release --panic-unwind"

[[d1_databases]]
binding = "auth"
database_name = "dev-auth"
database_id = "c26383b6-13c1-4784-abc9-f29444bca594"

[[env.production.d1_databases]]
binding = "auth"
database_name = "prod-auth"
database_id = "fe4e07bc-39ed-436d-b9e2-0c09a2e5d8a2"
