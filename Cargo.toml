[package]
name = "auth-worker"
version = "0.1.0"
edition = "2021"
authors = ["Jason Darcy <notnone@homeryland.com>"]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
worker = { version = "0.9", features = ['http', 'axum', 'd1'] }
worker-macros = { version = "0.9", features = ['http'] }
axum = { version = "0.8", default-features = false, features = [
  'json',
  'query',
] }
tower-http = { version = "0.7.1", features = ['cors'] }
tower-service = { version = "0.3.3" }
async-trait = { version = "0.1.92" }
serde = { version = "1.0.229", features = ['derive'] }
getrandom = { version = "0.4.3", features = ['wasm_js'] }
argon2 = { version = "0.6.0" } # argon2 need getrandom features['wasm_js'], or it can't work
snafu = { version = "0.9.2" }
uuid = { version = "1.29.3", features = ['serde', 'v7', 'js'] }
jiff = { version = "1.0.1", features = ['serde', 'js'] }
