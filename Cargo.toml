[package]
name = "auth"
version = "0.1.0"
edition = "2021"
authors = ["Jason Darcy <notnone@homeryland.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.9", features = ['http', 'axum', 'd1'] }
worker-macros = { version = "0.9", features = ['http'] }
axum = { version = "0.8", default-features = false }
tower-service = { version = "0.3.3" }
async-trait = { version = "0.1.92" }
serde = { version = "1.0.229", features = ['derive'] }
argon2 = { version = "0.6.0" }
snafu = { version = "0.9.2" }
uuid = { version = "1.29.3" }
jiff = { version = "1.0.1" }

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4", features = ['wasm_js'] }
